name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.60 can't install
    # Chromium. Revisit when upgrading Playwright.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # Cache node_modules by lockfile hash — invalidated only when dependencies
      # change, reused on every run where they haven't.
      - uses: actions/cache@v5
        id: node-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      # --with-deps installs OS-level dependencies (fonts, libs) that Chromium
      # requires on Ubuntu. Skipping this step causes browser launch failures.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      # Upload the HTML report only on failure — most useful when something is
      # wrong, and avoids accumulating artifacts on every green run.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
